<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Express</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="nav">
        <h1>Earn Points</h1>
    </div>

    <div class="container">

        <h2>Forgot to Scan?</h2>
        <p>Don't worry, just submit the details from your receipt to claim your points.</p>
        <p>Check the sample receipt provided for guidance.</p>

        <form action="" method="get" class="forms">
            <p>
            <label for="name">Store Name</label>
            <input type="text" name= "name" id="name">
            </p>

            <p>
            <label for="date">Date</label>
            <input type="date" name="date" id="date">
            </p>

            <p>
            <label for="order">Order Number</label>
            <input type="text" name="order" id="order">
            </p>

            <p>
            <label for="total">Order Total</label>
            <input type="text" name="total" id="total">
            </p>

            <p>
            <label for="service">How was your experience today?</label>
            <input type="checkbox" name="service" id="service">
            </p>
            
            <p>
            <label for="feedback">Additional Feedback (optional)</label>
            <input type="text" name="feedback" id="feedback">
            </p>

            <p>
            <label for="email">Sign me up for email addresses.</label>
            <input type="checkbox" name="email" id="email">
            </p>
        </form>
    </div>

    <button class="submit">Submit</button>
    <p class="small-text">*Points awarded will be based on your total, prior to tax.</p>
    <h3>Sample Receipt</h3>
    <div class="store-info">
        <p>Panda Express #1619</p>
        <p>Rosemead, CA</p>
        <p>(626)799-9898</p>
    </div>
</body>

</html>
